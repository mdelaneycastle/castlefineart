<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Artist — Castle Fine Art</title>
<link rel="icon" href="assets/img/favicon.svg">
<link rel="stylesheet" href="assets/css/site.css">
</head>
<body data-page="artists">
<main id="main">
  <div class="wrap">
    <nav class="crumbs" aria-label="Breadcrumb" style="padding-top:32px" id="crumbs"></nav>
    <section class="artist-hero" id="hero"></section>
  </div>

  <section class="section section--cotton" id="worksSec">
    <div class="wrap">
      <div class="section__head">
        <div><p class="eyebrow">The collection</p><h2 class="display" id="worksTitle">Available work</h2></div>
        <div class="region-tabs" style="margin:0" id="tabs"></div>
      </div>
      <div class="grid" id="works"></div>
    </div>
  </section>

  <section class="section">
    <div class="wrap">
      <div class="section__head"><div><p class="eyebrow">Discover</p><h2 class="display">More artists</h2></div><a class="link-arrow" href="artists.html">All artists →</a></div>
      <div class="artists-grid stagger" id="others"></div>
    </div>
  </section>
</main>
<script src="assets/js/data.js"></script>
<script src="assets/js/site.js"></script>
<script>
(function () {
  const D = CFA, U = CFAUI, { $, $$, esc, img } = U;
  const a = U.bySlug.get(U.param('a')) || D.artists.find(x => x.featured);
  document.title = `${a.n} — Castle Fine Art`;
  const works = D.products.filter(p => p.as === a.s);
  $('#crumbs').innerHTML = `<a href="index.html">Home</a><span>/</span><a href="artists.html">Artists</a><span>/</span><span>${esc(a.n)}</span>`;

  const pic = a.portrait || (a.img ? img(a.img, 1200) : '');
  const isQuote = s => /^['"‘“]/.test(s.trim());
  const bio = a.bio.map(p => isQuote(p) ? `<p class="quote">${esc(p.replace(/^['"‘“]|['"’”]$/g, ''))}</p>` : `<p>${esc(p)}</p>`).join('');
  const longBio = a.bio.join(' ').length > 1100;
  $('#hero').innerHTML = `
    <div class="artist-hero__img reveal-img">${pic ? `<img src="${pic}" alt="${esc(a.n)}">` : ''}</div>
    <div>
      <p class="eyebrow">Artist</p>
      <h1 class="display split">${esc(a.n)}</h1>
      <div style="display:flex;gap:28px;margin:22px 0 30px;font-size:.85rem;color:var(--grey);letter-spacing:.08em;text-transform:uppercase">
        <span>${works.length} artwork${works.length === 1 ? '' : 's'}</span>
        ${[...new Set(works.map(w => w.ty))].map(t => `<span>${esc(t)}</span>`).join('')}
      </div>
      ${a.bio.length ? `<div class="bio${longBio ? ' clamp' : ''}" id="bio">${bio}</div>
        ${longBio ? `<button class="link-arrow" id="bioMore" style="margin-top:18px">Read full biography</button>` : ''}`
        : `<p class="lede">Explore ${esc(a.n)}'s collection below, or visit one of our galleries to see the work in person.</p>`}
      <div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:34px">
        ${works.length ? `<a class="btn" href="#worksSec">View the collection</a>` : ''}
        <a class="btn btn--ghost" href="contact.html?topic=consultant&artist=${a.s}">Register interest</a>
      </div>
    </div>`;
  $('#bioMore')?.addEventListener('click', e => { const b = $('#bio'); const open = b.classList.toggle('open'); b.style.maxHeight = open ? b.scrollHeight + 'px' : ''; e.target.textContent = open ? 'Show less' : 'Read full biography'; });

  if (!works.length) $('#worksSec').hidden = true;
  const types = ['All', ...new Set(works.map(w => w.ty))];
  $('#tabs').innerHTML = types.length > 2 ? types.map((t, i) => `<button class="${i ? '' : 'on'}" data-t="${esc(t)}">${esc(t)}</button>`).join('') : '';
  function show(t) {
    const list = works.filter(w => t === 'All' || w.ty === t).sort((x, y) => (y.av - x.av) || y.date.localeCompare(x.date));
    $('#works').innerHTML = list.map((p, i) => U.cardHtml(p, { enter: true, delay: Math.min(i, 12) * 50 })).join('');
    $('#worksTitle').textContent = t === 'All' ? `The ${a.n} collection` : t;
  }
  $('#tabs').onclick = e => { const b = e.target.closest('button'); if (!b) return; $$('#tabs button').forEach(x => x.classList.toggle('on', x === b)); show(b.dataset.t); };
  show('All');

  const others = D.artists.filter(x => x.s !== a.s && x.portrait && x.count).sort(() => Math.random() - .5).slice(0, 4);
  $('#others').innerHTML = others.map(x => `<a class="artist-card" href="artist.html?a=${x.s}"><div class="artist-card__img"><img loading="lazy" src="${x.portrait}" alt="${esc(x.n)}"></div><h3>${esc(x.n)}</h3><p>${x.count} artworks</p></a>`).join('');
  U.observe();
})();
</script>
</body>
</html>
